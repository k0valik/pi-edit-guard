name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 2
    outputs:
      has_affected: ${{ steps.compute.outputs.has_affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure PR body has Full CI checkbox
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BODY="$(gh pr view "$PR_NUM" --json body --jq '.body // ""')"

          if echo "$BODY" | grep -qiE '-\s*\[[ x]\]\s*full ci'; then
            echo "✓ Full CI checkbox already present in PR body"
            exit 0
          fi

          printf '%s\n' \
            '## CI' \
            '' \
            '- [ ] **Full CI** — run typecheck + tests for **all** packages' \
            '' \
            "$BODY" \
            > /tmp/pr-body.txt

          gh pr edit "$PR_NUM" --body "$(cat /tmp/pr-body.txt)"
          echo "✓ Injected Full CI checkbox into PR body"
        continue-on-error: true

      - name: Check PR body for checked Full CI checkbox
        id: pr-check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body // ""')"
          if echo "$BODY" | grep -qiE '-\s*\[x\]\s*full ci'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute affected packages
        id: compute
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] || [ '${{ steps.pr-check.outputs.result }}' = 'true' ]; then
            echo "has_affected=true" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.pull_request.base.ref }}"
            HEAD="$HEAD_REF"
            if git diff "origin/${BASE}...HEAD" --name-only | grep -qE '^(src/|extension\.ts|packages/pi-base/)'; then
              echo "has_affected=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_affected=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820782786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on lint issues
        run: pnpm lint

  typecheck:
    name: Typecheck
    needs: [changes]
    if: |
      !github.event.pull_request.draft
      && needs.changes.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820782786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    needs: [changes, typecheck]
    if: |
      !github.event.pull_request.draft
      && needs.changes.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820782786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  fallow-audit:
    if: github.event_name == 'pull_request'
    name: Fallow - changed-code audit
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3.9.1
        continue-on-error: true
        with:
          command: audit
          format: compact
          comment: true
          review-comments: false
          sarif: false

  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820782786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --prod || true
        continue-on-error: true
